# With the service's Root Directory set to backend, Railway reads this only if its
# Config File setting is /backend/railway.toml. It stops reading these files on
# 2026-12-01: see "Railway's config file" in DEPLOYMENT_GUIDE.md.
[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "sh -c 'exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --timeout-graceful-shutdown 10'"
healthcheckPath = "/health"
# Long enough for a slow container start plus the database's 10 second connect timeout
healthcheckTimeout = 60
# Time to finish after the stop signal, a little longer than uvicorn's own limit
drainingSeconds = 15
