# Runs the test suite on every push and pull request, on the Python version
# and exact package versions the Docker image uses.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # New vulnerabilities are published whether or not anyone is pushing
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Run tests
        run: python -m pytest tests -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Look for known vulnerabilities in the pinned packages
        run: pip-audit -r constraints.txt --no-deps --disable-pip

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the image Railway deploys
        run: docker build -t moodforecast backend
      - name: Start it and check it answers
        run: |
          docker run -d --name app -p 8000:8000 moodforecast
          for attempt in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            if [ "$attempt" = 20 ]; then docker logs app; exit 1; fi
            sleep 1
          done
      - name: Check the page and its preview image are in the image
        run: |
          curl -sf http://localhost:8000/ | grep -q 'property="og:image"'
          curl -sf http://localhost:8000/privacy.html | grep -q 'rel="canonical"'
          curl -sf -o /dev/null http://localhost:8000/og-image.png
      - name: Check it shuts down cleanly when told to stop
        run: |
          docker stop --time 15 app
          docker logs app 2>&1 | grep -q 'Shutdown complete'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r requirements-browser.txt -c constraints.txt
          playwright install --with-deps chromium
      - name: Run the page in a browser
        run: python -m pytest browser_tests -q
